<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steak</title>
</head>
<body>
    <h1>Steak</h1>
    <a href="../index.html">Home</a>
    <br><img src="images/steak.jpeg" alt="A piece of steak" height="310" width="310">
    <h2>Ingredients</h2>
    <ul>
        <li>300g ribeye</li>
        <li>salt</li>
        <li>pepper</li>
        <li>butter</li>
        <li>thyme</li>
        <li>2-3 cloves of garlic</li>
    </ul>
    <h2>Steps</h2>
    <ol>
        <li>Season steak with salt and pepper</li>
        <li>Sear in hot pan flipping every 2 minutes</li>
        <li>Baste in butter after flipping</li>
        <li>Throw in garlic and thyme can continue basting</li>
    </ol>
</body>
